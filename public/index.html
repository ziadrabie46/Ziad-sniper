<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>قناص الدراسات - مالتي بلاير</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #1e293b; touch-action: none; font-family: sans-serif; }
        #login-screen { position: absolute; width: 100%; height: 100%; background: rgba(15,23,42,0.9); z-index: 1000; display: flex; align-items: center; justify-content: center; color: white; }
        .box { background: #334155; padding: 30px; border-radius: 15px; border: 3px solid #fbbf24; text-align: center; }
        input { padding: 10px; margin: 10px; border-radius: 5px; border: none; width: 200px; display: block; }
        #controls { position: absolute; bottom: 40px; left: 20px; z-index: 500; display: none; }
        .grid { display: grid; grid-template-columns: repeat(3, 70px); gap: 10px; }
        .btn { width: 70px; height: 70px; background: rgba(255,255,255,0.2); border: 2px solid white; border-radius: 50%; color: white; font-size: 24px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div id="login-screen">
        <div class="box">
            <h2>🎯 قناص الدراسات</h2>
            <input type="text" id="uname" placeholder="اسمك">
            <input type="text" id="uroom" placeholder="رقم الروم">
            <button onclick="enter()" style="background:#fbbf24; border:none; padding:10px 20px; border-radius:5px; font-weight:bold;">دخول</button>
        </div>
    </div>
    <div id="controls">
        <div class="grid">
            <div></div><div class="btn" id="btn-u">↑</div><div></div>
            <div class="btn" id="btn-l">←</div><div class="btn" id="btn-d">↓</div><div class="btn" id="btn-r">→</div>
        </div>
    </div>
    <script src="script.js"></script>
    <script>
        function enter() {
            let n = document.getElementById('uname').value;
            let r = document.getElementById('uroom').value;
            if(n && r) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('controls').style.display = 'block';
                startMultiplayer(n, r);
            }
        }
    </script>
</body>
</html>
