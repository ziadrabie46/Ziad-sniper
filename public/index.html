<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>أساطير القلعة 🧟</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #ui-layer { position: absolute; top: 10px; left: 10px; z-index: 100; pointer-events: none; }
        .stat { background: rgba(0,0,0,0.8); color: #fbbf24; padding: 5px 15px; margin: 5px; border-left: 4px solid #fbbf24; border-radius: 4px; font-size: 14px; }
        #login-overlay { position: absolute; width: 100%; height: 100%; background: #111; z-index: 1000; display: flex; justify-content: center; align-items: center; }
        .login-box { background: #222; padding: 30px; border-radius: 15px; border: 2px solid #fbbf24; text-align: center; color: white; }
        input { padding: 10px; width: 80%; margin: 10px; border-radius: 5px; border: none; }
        button { background: #fbbf24; color: black; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-box">
            <h2>قناص الدراسات 🎯</h2>
            <input type="text" id="pName" placeholder="اسمك البطل">
            <input type="text" id="pRoom" placeholder="رقم الغرفة">
            <br>
            <button onclick="start()">دخول اللعبة</button>
        </div>
    </div>

    <div id="ui-layer">
        <div class="stat">💰 النقط: <span id="score">0</span></div>
        <div class="stat">🔋 الرصاص: <span id="ammo">15</span></div>
        <div class="stat">❤️ دمك: <span id="hp">100</span></div>
        <div class="stat">🏰 القلعة: <span id="castle">500</span></div>
    </div>

    <script src="script.js"></script>
    <script>
        function start() {
            let n = document.getElementById('pName').value;
            let r = document.getElementById('pRoom').value;
            if(n && r) {
                document.getElementById('login-overlay').style.display = 'none';
                startMultiplayer(n, r); // دي اللي في ملف script.js
            } else {
                alert("اكتب اسمك والروم الأول يا بطل!");
            }
        }
    </script>
</body>
</html>
