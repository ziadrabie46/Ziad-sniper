<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>قناص الدراسات - أونلاين</title>
    
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: #0f172a; 
            touch-action: none; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        /* واجهة الدخول */
        #login-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .login-box {
            background: #1e293b;
            padding: 30px;
            border-radius: 20px;
            border: 3px solid #fbbf24;
            text-align: center;
            width: 85%;
            max-width: 350px;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.3);
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 2px solid #334155;
            background: #0f172a;
            color: white;
            text-align: center;
            font-size: 16px;
        }

        button {
            background: #fbbf24;
            color: #000;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 18px;
            transition: 0.3s;
        }

        button:hover { background: #f59e0b; }

        /* واجهة المعلومات أثناء اللعب */
        #game-info {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 15px;
            border-radius: 10px;
            border-right: 4px solid #fbbf24;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h1 style="color: #fbbf24; margin-top: 0;">قناص الدراسات 🎯</h1>
            <p>العب أونلاين مع أصحابك</p>
            <input type="text" id="username" placeholder="اكتب اسمك">
            <input type="text" id="room-id" placeholder="رقم الروم (مثلاً: 55)">
            <button onclick="joinGame()">دخول الروم</button>
        </div>
    </div>

    <div id="game-info" style="display: none;">
        <div>اللاعب: <span id="display-name" style="color: #fbbf24;">--</span></div>
        <div>الروم: <span id="display-room">--</span></div>
        <hr>
        <div>النقاط: <span id="score">0</span></div>
    </div>

    <script src="script.js"></script>

    <script>
        function joinGame() {
            const name = document.getElementById('username').value;
            const room = document.getElementById('room-id').value;
            
            if (name && room) {
                // إخفاء شاشة الدخول وإظهار واجهة اللعبة
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('game-info').style.display = 'block';
                document.getElementById('display-name').innerText = name;
                document.getElementById('display-room').innerText = room;
                
                // استدعاء دالة البدء الموجودة في script.js
                if (typeof startMultiplayer === "function") {
                    startMultiplayer(name, room);
                }
            } else {
                alert("من فضلك اكتب اسمك ورقم الروم");
            }
        }
    </script>
</body>
</html>
