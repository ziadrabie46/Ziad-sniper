<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أساطير القلعة: زومبي شوتر 🧟</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body { margin: 0; background: #0a0a0a; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        #ui-layer { position: absolute; top: 20px; left: 20px; z-index: 10; pointer-events: none; }
        .stat-box { background: rgba(0,0,0,0.7); border-left: 5px solid #fbbf24; padding: 10px 20px; margin-bottom: 10px; border-radius: 0 10px 10px 0; }
        #shop-menu { position: absolute; right: 20px; top: 20px; background: rgba(20,20,20,0.9); border: 2px solid #fbbf24; padding: 15px; border-radius: 15px; display: none; }
        .shop-btn { background: #fbbf24; color: black; border: none; padding: 8px; margin: 5px 0; cursor: pointer; width: 100%; font-weight: bold; border-radius: 5px; }
        .shop-btn:disabled { background: #555; }
        #joystick-container { position: absolute; bottom: 30px; left: 30px; display: none; }
        #fire-btn { position: absolute; bottom: 40px; right: 40px; width: 100px; height: 100px; background: radial-gradient(#ff4444, #990000); border-radius: 50%; border: 5px solid white; display: none; justify-content: center; align-items: center; font-size: 40px; color: white; box-shadow: 0 0 20px red; }
    </style>
</head>
<body>
    <div id="ui-layer">
        <div class="stat-box">💰 النقط: <span id="score-val">0</span></div>
        <div class="stat-box">🔋 الرصاص: <span id="ammo-val">15</span></div>
        <div class="stat-box">❤️ دمك: <span id="hp-val">100</span></div>
        <div class="stat-box">🏰 القلعة: <span id="castle-val">500</span></div>
    </div>

    <div id="shop-menu">
        <h3 style="margin-top:0">المتجر 🛒</h3>
        <button class="shop-btn" onclick="buyMine()">لغم أرضي (500$)</button>
        <button class="shop-btn" onclick="buyHealth()">إسعافات (300$)</button>
        <button class="shop-btn" onclick="closeShop()">إغلاق</button>
    </div>

    <div id="fire-btn" onclick="shoot()">🔥</div>

    <script src="script.js"></script>
</body>
</html>
