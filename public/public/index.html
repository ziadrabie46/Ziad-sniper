<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>قناص الدراسات أونلاين</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #0f172a; touch-action: none; font-family: sans-serif; }
        #login-screen { position: absolute; width: 100%; height: 100%; background: #1e293b; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .box { background: #334155; padding: 25px; border-radius: 15px; text-align: center; border: 3px solid #fbbf24; width: 80%; max-width: 300px; }
        input { padding: 10px; border-radius: 8px; border: none; width: 90%; margin: 8px 0; text-align: center; }
        .btn { background: #fbbf24; color: black; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; border: none; width: 100%; }
        /* أزرار التحكم */
        #controls { position: absolute; bottom: 30px; left: 20px; z-index: 500; display: none; }
        .joy-grid { display: grid; grid-template-columns: repeat(3, 65px); gap: 10px; }
        .joy-btn { width: 65px; height: 65px; background: rgba(255,255,255,0.2); border: 2px solid white; border-radius: 50%; color: white; font-size: 24px; display: flex; align-items: center; justify-content: center; user-select: none; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="box">
            <h2 style="color: #fbbf24;">قناص الدراسات 🎯</h2>
            <input type="text" id="uname" placeholder="اسمك">
            <input type="text" id="uroom" placeholder="رقم الروم">
            <button class="btn" onclick="enterGame()">ابدأ الآن</button>
        </div>
    </div>

    <div id="controls">
        <div class="joy-grid">
            <div></div><div class="joy-btn" id="btn-u">↑</div><div></div>
            <div class="joy-btn" id="btn-l">←</div><div class="joy-btn" id="btn-d">↓</div><div class="joy-btn" id="btn-r">→</div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        function enterGame() {
            let n = document.getElementById('uname').value;
            let r = document.getElementById('uroom').value;
            if(n && r) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('controls').style.display = 'block';
                startMultiplayer(n, r);
            }
        }
    </script>
</body>
</html>
